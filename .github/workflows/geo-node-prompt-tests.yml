name: Geo Node Prompt tests

on:
  push:
    paths:
      - "geo_node_prompt/**"
      - "tests/geo_node_prompt_tests/**"
      - ".github/workflows/geo-node-prompt-tests.yml"
  pull_request:
    paths:
      - "geo_node_prompt/**"
      - "tests/geo_node_prompt_tests/**"
      - ".github/workflows/geo-node-prompt-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Blender 4.0 은 Python 3.10, 4.1 이상은 3.11 을 번들한다.
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest tests/geo_node_prompt_tests -v
