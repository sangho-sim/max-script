<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>MaxPlayer</title>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
<symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></symbol>
<symbol id="i-cc" viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></symbol>
<symbol id="i-aspect" viewBox="0 0 24 24"><path d="M19 12h-2v3h-3v2h5v-5zM7 9h3V7H5v5h2V9zm14-6H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.99h18v14.02z"/></symbol>
<symbol id="i-rotate" viewBox="0 0 24 24"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.44L2.81 9.17l6.36-6.36 12.02 12.02-6.36 6.36zm-7.31.29C4.25 19.94 1.91 16.76 1.55 13H.05C.56 19.16 5.71 24 12 24l.66-.03-3.81-3.81-1.33 1.32z"/></symbol>
<symbol id="i-pip" viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></symbol>
</defs></svg>

<main id="home">
  <header><img src="icon.svg" alt="" width="40" height="40"><h1>MaxPlayer</h1></header>
  <button id="open" class="cta"><svg><use href="#i-folder"/></svg>영상 열기</button>
  <p class="hint">영상 여러 개와 자막(.srt .smi .vtt .ass)을 함께 선택하면 재생목록으로 열립니다.</p>
  <section id="recent"><h2>최근 재생 <button id="clear" class="link">기록 삭제</button></h2><ul id="rlist"></ul></section>
</main>

<section id="player" hidden>
  <video id="v" playsinline preload="auto"></video>
  <div id="note">♪</div>
  <div id="subs"></div>
  <div id="dim"></div>
  <div id="touch"></div>
  <div id="hud"></div>
  <div id="ui">
    <div class="top">
      <button id="bBack" aria-label="뒤로"><svg><use href="#i-back"/></svg></button>
      <div id="title"></div>
      <button id="bCC" aria-label="자막"><svg><use href="#i-cc"/></svg></button>
      <button id="bMore" aria-label="더보기"><svg><use href="#i-more"/></svg></button>
    </div>
    <div class="bottom">
      <div class="seekrow">
        <span id="tCur">0:00</span>
        <div id="bar"><div id="track"><div id="fill"></div><div id="ab" hidden></div></div><div id="thumb"></div></div>
        <span id="tDur">0:00</span>
      </div>
      <div class="btns">
        <button id="bLock" aria-label="잠금"><svg><use href="#i-lock"/></svg></button>
        <button id="bAspect" aria-label="화면 비율"><svg><use href="#i-aspect"/></svg></button>
        <button id="bPrev" aria-label="이전"><svg><use href="#i-prev"/></svg></button>
        <button id="bPlay" class="big" aria-label="재생/일시정지"><svg><use href="#i-play"/></svg></button>
        <button id="bNext" aria-label="다음"><svg><use href="#i-next"/></svg></button>
        <button id="bSpeed" class="txt">1x</button>
        <button id="bRot" aria-label="전체화면/회전"><svg><use href="#i-rotate"/></svg></button>
        <button id="bPip" aria-label="PIP"><svg><use href="#i-pip"/></svg></button>
      </div>
    </div>
  </div>
  <button id="unlock" hidden aria-label="잠금 해제"><svg><use href="#i-lock"/></svg></button>
</section>

<div id="scrim" hidden></div>
<div id="sheet" hidden></div>
<input type="file" id="fv" accept="video/*,audio/*,.mkv,.avi,.ts,.srt,.vtt,.smi,.ass,.ssa" multiple hidden>
<input type="file" id="fs" accept=".srt,.vtt,.smi,.sami,.ass,.ssa,text/*" hidden>
<script src="app.js" defer></script>
</body>
</html>
